<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1200" height="820" rx="0" fill="#f7fafb" stroke="none" opacity="1"/><text x="36" y="48" font-size="30" fill="#123047" font-weight="bold" text-anchor="start">Intercell flux: donor conductivity or matric-head gradient?</text><text x="36" y="84" font-size="22" fill="#557080" font-weight="normal" text-anchor="start">Downward-positive coordinate ξ. Conceptual cells; illustrative parameter calculation.</text><rect x="28" y="112" width="554" height="472" rx="14" fill="white" stroke="none" opacity="1"/><rect x="608" y="112" width="564" height="472" rx="14" fill="white" stroke="none" opacity="1"/><text x="52" y="153" font-size="26" fill="#008f83" font-weight="bold" text-anchor="start">Current storage-node kernel</text><text x="632" y="153" font-size="26" fill="#db8b24" font-weight="bold" text-anchor="start">Tu, Wadzuk &amp; Traver (2020)</text><rect x="52" y="183" width="210" height="99" rx="8" fill="#e2d5bd" stroke="none" opacity="1"/><rect x="52" y="331" width="210" height="99" rx="8" fill="#e2d5bd" stroke="none" opacity="1"/><text x="67" y="218" font-size="22" fill="#123047" font-weight="bold" text-anchor="start">Donor cell i</text><text x="67" y="254" font-size="22" fill="#123047" font-weight="normal" text-anchor="start">Moisture θᵢ</text><text x="67" y="367" font-size="22" fill="#123047" font-weight="bold" text-anchor="start">Receiver i + 1</text><text x="67" y="403" font-size="22" fill="#123047" font-weight="normal" text-anchor="start">Moisture θᵢ₊₁</text><rect x="632" y="183" width="210" height="99" rx="8" fill="#e2d5bd" stroke="none" opacity="1"/><rect x="632" y="331" width="210" height="99" rx="8" fill="#e2d5bd" stroke="none" opacity="1"/><text x="647" y="218" font-size="22" fill="#123047" font-weight="bold" text-anchor="start">Donor cell i</text><text x="647" y="254" font-size="22" fill="#123047" font-weight="normal" text-anchor="start">Moisture θᵢ</text><text x="647" y="367" font-size="22" fill="#123047" font-weight="bold" text-anchor="start">Receiver i + 1</text><text x="647" y="403" font-size="22" fill="#123047" font-weight="normal" text-anchor="start">Moisture θᵢ₊₁</text><line x1="157" y1="285" x2="157" y2="324" stroke="#008f83" stroke-width="6" marker-end="url(#arrow)"/><text x="287" y="228" font-size="21" fill="#008f83" font-weight="bold" text-anchor="start">qᵢ = K<tspan baseline-shift="sub" font-size="75%">s</tspan> exp[−m (φ − θ)]</text><text x="287" y="269" font-size="20" fill="#557080" font-weight="normal" text-anchor="start">Above field capacity;</text><text x="287" y="299" font-size="20" fill="#557080" font-weight="normal" text-anchor="start">otherwise zero.</text><text x="287" y="365" font-size="20" fill="#557080" font-weight="normal" text-anchor="start">Receiver limits volume,</text><text x="287" y="395" font-size="20" fill="#557080" font-weight="normal" text-anchor="start">not the trial conductivity.</text><text x="52" y="471" font-size="22" fill="#557080" font-weight="normal" text-anchor="start">No adjacent-cell matric-head calculation.</text><text x="52" y="508" font-size="21" fill="#008f83" font-weight="bold" text-anchor="start">10 × exp[−10 (0.45 − 0.30)] = 2.23 mm/h</text><text x="52" y="550" font-size="21" fill="#557080" font-weight="normal" text-anchor="start">Ks = 10 mm/h; θFC = 0.20; slope m = 10</text><line x1="732" y1="287" x2="732" y2="326" stroke="#008f83" stroke-width="5" marker-end="url(#arrow)"/><line x1="770" y1="325" x2="770" y2="286" stroke="#db8b24" stroke-width="5" marker-end="url(#arrow)"/><text x="867" y="223" font-size="24" fill="#db8b24" font-weight="bold" text-anchor="start">q = K(θ) − D(θ) ∂θ/∂ξ</text><text x="867" y="263" font-size="23" fill="#db8b24" font-weight="normal" text-anchor="start">D = K dψ/dθ</text><text x="867" y="304" font-size="20" fill="#557080" font-weight="normal" text-anchor="start">Matric gradients can</text><text x="867" y="334" font-size="20" fill="#557080" font-weight="normal" text-anchor="start">augment, oppose or</text><text x="867" y="364" font-size="20" fill="#557080" font-weight="normal" text-anchor="start">reverse gravity flow.</text><text x="632" y="471" font-size="22" fill="#557080" font-weight="normal" text-anchor="start">van Genuchten retention / conductivity</text><text x="632" y="508" font-size="22" fill="#557080" font-weight="normal" text-anchor="start">Different textures: match matric head</text><text x="632" y="550" font-size="21" fill="#557080" font-weight="normal" text-anchor="start">Implemented with SWMM pumps and controls</text><rect x="28" y="607" width="1144" height="183" rx="12" fill="#eaf1f4" stroke="none" opacity="1"/><text x="52" y="646" font-size="26" fill="#008f83" font-weight="bold" text-anchor="start">Surface → media: modified Green–Ampt entry</text><text x="52" y="687" font-size="25" fill="#123047" font-weight="normal" text-anchor="start">f_cap = Ks [1 + (suction + ponded head) Δθ / F]     (existing front, F &gt; 0)</text><text x="52" y="726" font-size="23" fill="#557080" font-weight="normal" text-anchor="start">ΔV = min(potential volume, donor water, receiving space); δt ≤ 1 s.</text><text x="52" y="763" font-size="21" fill="#557080" font-weight="normal" text-anchor="start">Accepted entry advances F. A submerged receiver routes to shared mobile storage.</text></svg>