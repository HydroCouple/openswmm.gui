<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1200" height="820" rx="0" fill="#f7fafb" stroke="none" opacity="1"/><text x="36" y="48" font-size="31" fill="#123047" font-weight="bold" text-anchor="start">Interlayer flux uses both conductivity and total head</text><text x="36" y="84" font-size="21" fill="#557080" font-weight="normal" text-anchor="start">Positive Q is downward. Pressure differences can reinforce, oppose or reverse gravity.</text><rect x="28" y="112" width="362" height="335" rx="14" fill="white" stroke="none" opacity="1"/><text x="50" y="154" font-size="22" fill="#188fb6" font-weight="bold" text-anchor="start">DOWNWARD</text><rect x="80" y="192" width="258" height="82" rx="0" fill="#e2d5bd" stroke="none" opacity="1"/><rect x="80" y="330" width="258" height="82" rx="0" fill="#b7c5cc" stroke="none" opacity="1"/><text x="209" y="240" font-size="24" fill="#123047" font-weight="normal" text-anchor="middle">Upper H = 1.4 m</text><text x="209" y="378" font-size="24" fill="#123047" font-weight="normal" text-anchor="middle">Lower H = 0.9 m</text><line x1="209" y1="278" x2="209" y2="326" stroke="#188fb6" stroke-width="5" marker-end="url(#arrow)"/><rect x="419" y="112" width="362" height="335" rx="14" fill="white" stroke="none" opacity="1"/><text x="441" y="154" font-size="22" fill="#557080" font-weight="bold" text-anchor="start">EQUILIBRIUM</text><rect x="471" y="192" width="258" height="82" rx="0" fill="#e2d5bd" stroke="none" opacity="1"/><rect x="471" y="330" width="258" height="82" rx="0" fill="#b7c5cc" stroke="none" opacity="1"/><text x="600" y="240" font-size="24" fill="#123047" font-weight="normal" text-anchor="middle">Upper H = 1.0 m</text><text x="600" y="378" font-size="24" fill="#123047" font-weight="normal" text-anchor="middle">Lower H = 1.0 m</text><text x="600" y="309" font-size="25" fill="#557080" font-weight="normal" text-anchor="middle">Q = 0</text><rect x="810" y="112" width="362" height="335" rx="14" fill="white" stroke="none" opacity="1"/><text x="832" y="154" font-size="22" fill="#db8b24" font-weight="bold" text-anchor="start">UPWARD</text><rect x="862" y="192" width="258" height="82" rx="0" fill="#e2d5bd" stroke="none" opacity="1"/><rect x="862" y="330" width="258" height="82" rx="0" fill="#b7c5cc" stroke="none" opacity="1"/><text x="991" y="240" font-size="24" fill="#123047" font-weight="normal" text-anchor="middle">Upper H = 0.4 m</text><text x="991" y="378" font-size="24" fill="#123047" font-weight="normal" text-anchor="middle">Lower H = 0.9 m</text><line x1="991" y1="326" x2="991" y2="278" stroke="#db8b24" stroke-width="5" marker-end="url(#arrow)"/><rect x="28" y="469" width="1144" height="309" rx="14" fill="white" stroke="none" opacity="1"/><text x="53" y="513" font-size="30" fill="#123047" font-weight="bold" text-anchor="start">Q_f = A_f K_f (H_upper − H_lower) / d_f</text><text x="53" y="559" font-size="25" fill="#008f83" font-weight="normal" text-anchor="start">Same material, equal cells: K_f = (K_upper + K_lower) / 2</text><text x="53" y="610" font-size="23" fill="#188fb6" font-weight="normal" text-anchor="start">Different materials: R_f = Δz_upper/(2K_upper) + Δz_lower/(2K_lower)</text><text x="53" y="652" font-size="27" fill="#188fb6" font-weight="normal" text-anchor="start">Q_f = A_f (H_upper − H_lower) / R_f</text><text x="53" y="696" font-size="21" fill="#557080" font-weight="normal" text-anchor="start">Example: A = 1 m², K_f = 10 mm/h, d = 0.2 m, ΔH = −0.10 m</text><text x="53" y="738" font-size="25" fill="#db8b24" font-weight="bold" text-anchor="start">Q = −5 litres/hour: capillary redistribution upward</text><text x="36" y="810" font-size="18" fill="#557080" font-weight="normal" text-anchor="start">Calculated equation example · no field calibration · hydraulic/physical material interfaces need measured properties</text></svg>