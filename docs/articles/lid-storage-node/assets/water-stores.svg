baseline-shift="sub" font-size="75%">s</tspan> max(ψᵢ, 0)]</text><text x="644" y="238" font-size="20" fill="#557080" font-weight="normal" text-anchor="start">θ ≤ porosity; pressure can rise above zero.</text><text x="644" y="313" font-size="20" fill="#008f83" font-weight="bold" text-anchor="start">CONSERVATIVE FACE BALANCE</text><text x="644" y="361" font-size="25" fill="#123047" font-weight="normal" text-anchor="start">dWᵢ/dt = Q_in − Q_out − Eᵢ</text><text x="644" y="397" font-size="20" fill="#557080" font-weight="normal" text-anchor="start">One face transfer: equal loss and gain.</text><text x="644" y="475" font-size="20" fill="#008f83" font-weight="bold" text-anchor="start">LOCAL TOTAL HEAD</text><text x="644" y="523" font-size="25" fill="#123047" font-weight="normal" text-anchor="start">Hᵢ = zᵢ + ψᵢ</text><text x="644" y="559" font-size="20" fill="#557080" font-weight="normal" text-anchor="start">Buried connections use local cell pressure.</text><text x="644" y="653" font-size="24" fill="#188fb6" font-weight="bold" text-anchor="start">Total facility water = ponding + Σ Wᵢ</text><text x="644" y="695" font-size="21" fill="#557080" font-weight="normal" text-anchor="start">No duplicate saturated/mobile inventory.</text><text x="36" y="803" font-size="19" fill="#557080" font-weight="normal" text-anchor="start">Formulation schematic · illustrative section · elastic storage Ss is a physical material input</text></svg>