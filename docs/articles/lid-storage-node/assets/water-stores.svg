5.8" r="4.2" fill="#008f83" stroke="none"/><circle cx="230" cy="395.8" r="4.2" fill="#008f83" stroke="none"/><circle cx="264" cy="395.8" r="4.2" fill="#008f83" stroke="none"/><circle cx="298" cy="395.8" r="4.2" fill="#008f83" stroke="none"/><circle cx="332" cy="395.8" r="4.2" fill="#008f83" stroke="none"/><circle cx="366" cy="395.8" r="4.2" fill="#008f83" stroke="none"/><circle cx="400" cy="395.8" r="4.2" fill="#008f83" stroke="none"/><circle cx="434" cy="395.8" r="4.2" fill="#008f83" stroke="none"/><text x="56" y="247" font-size="19" fill="#123047" font-weight="bold" text-anchor="start">SURFACE</text><text x="56" y="273" font-size="16" fill="#557080" font-weight="normal" text-anchor="start">6 in · φ = 0.90</text><text x="56" y="325" font-size="19" fill="#123047" font-weight="bold" text-anchor="start">MEDIA</text><text x="56" y="351" font-size="16" fill="#557080" font-weight="normal" text-anchor="start">12 in · φ = 0.45</text><text x="56" y="445" font-size="18" fill="#123047" font-weight="bold" text-anchor="start">AGGREGATE</text><text x="56" y="471" font-size="16" fill="#557080" font-weight="normal" text-anchor="start">12 in · φ = 0.40</text><line x1="179" y1="446.8" x2="618" y2="446.8" stroke="#188fb6" stroke-width="2" stroke-dasharray="7 5"/><text x="475" y="434.8" font-size="20" fill="#188fb6" font-weight="bold" text-anchor="start">h = 0.70 ft</text><line x1="220" y1="181" x2="220" y2="214" stroke="#188fb6" stroke-width="4" marker-end="url(#arrow)"/><text x="177" y="177" font-size="20" fill="#188fb6" font-weight="normal" text-anchor="start">Runoff</text><line x1="389" y1="214" x2="389" y2="181" stroke="#db8b24" stroke-width="4" marker-end="url(#arrow)"/><text x="361" y="177" font-size="20" fill="#db8b24" font-weight="normal" text-anchor="start">Evaporation</text><line x1="454" y1="283" x2="620" y2="283" stroke="#557080" stroke-width="3"/><text x="475" y="264" font-size="19" fill="#557080" font-weight="normal" text-anchor="start">Overflow crest</text><text x="475" y="309" font-size="18" fill="#557080" font-weight="normal" text-anchor="start">z = 2.00 ft</text><line x1="316" y1="367" x2="316" y2="428" stroke="#008f83" stroke-width="4" marker-end="url(#arrow)"/><text x="338" y="396" font-size="18" fill="#008f83" font-weight="normal" text-anchor="start">Drainage</text><line x1="454" y1="505" x2="618" y2="505" stroke="#188fb6" stroke-width="4" marker-end="url(#arrow)"/><circle cx="548" cy="505" r="12" fill="white" stroke="#188fb6"/><line x1="540" y1="513" x2="556" y2="497" stroke="#188fb6" stroke-width="3"/><text x="475" y="544" font-size="18" fill="#188fb6" font-weight="normal" text-anchor="start">Layer port / valve</text><line x1="179" y1="535" x2="454" y2="535" stroke="#123047" stroke-width="4"/><text x="316" y="570" font-size="19" fill="#557080" font-weight="normal" text-anchor="middle">Closed bottom in these examples</text><text x="50" y="612" font-size="20" fill="#557080" font-weight="normal" text-anchor="start">Dots: retained moisture · Blue: mobile water</text><text x="50" y="643" font-size="20" fill="#557080" font-weight="normal" text-anchor="start">Five media cells resolve the moisture profile.</text><text x="696" y="148" font-size="20" fill="#008f83" font-weight="bold" text-anchor="start">RETAINED WATER</text><text x="696" y="187" font-size="27" fill="#008f83" font-weight="normal" text-anchor="start">Vᵣ = Σ θᵢ Gᵢ</text><text x="696" y="222" font-size="20" fill="#557080" font-weight="normal" text-anchor="start">Media θ = 0.20; aggregate θ = 0</text><text x="696" y="263" font-size="31" fill="#008f83" font-weight="bold" text-anchor="start">200 ft³</text><text x="696" y="314" font-size="20" fill="#188fb6" font-weight="bold" text-anchor="start">MOBILE WATER</text><text x="696" y="353" font-size="27" fill="#188fb6" font-weight="normal" text-anchor="start">V<tspan baseline-shift="sub" font-size="75%">m</tspan>(h) = Σ (φᵢ − θᵢ) Gᵢ sᵢ(h)</text><text x="696" y="388" font-size="20" fill="#557080" font-weight="normal" text-anchor="start">sᵢ(h): fraction of a cell below h</text><text x="696" y="429" font-size="31" fill="#188fb6" font-weight="bold" text-anchor="start">280 ft³</text><text x="696" y="480" font-size="20" fill="#123047" font-weight="bold" text-anchor="start">TOTAL WATER INVENTORY</text><text x="696" y="519" font-size="27" fill="#123047" font-weight="normal" text-anchor="start">V = Vᵣ + V<tspan baseline-shift="sub" font-size="75%">m</tspan></text><text x="696" y="554" font-size="20" fill="#557080" font-weight="normal" text-anchor="start">Footprint A = 1,000 ft²; invert z = 0</text><text x="696" y="595" font-size="31" fill="#123047" font-weight="bold" text-anchor="start">480 ft³</text><rect x="28" y="692" width="1144" height="98" rx="12" fill="#eaf1f4" stroke="none" opacity="1"/><text x="50" y="730" font-size="25" fill="#123047" font-weight="bold" text-anchor="start">Internal drainage moves water between stores with equal debits and credits.</text><text x="50" y="766" font-size="22" fill="#557080" font-weight="normal" text-anchor="start">Gᵢ: cell geometric volume · θᵢ: retained water fraction · φᵢ: available void fraction</text></svg>