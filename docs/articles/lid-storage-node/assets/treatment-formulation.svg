<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1200" height="820" rx="0" fill="#f7fafb" stroke="none" opacity="1"/><text x="36" y="48" font-size="32" fill="#123047" font-weight="bold" text-anchor="start">Treatment follows pollutant mass and exposure time.</text><text x="36" y="84" font-size="23" fill="#557080" font-weight="normal" text-anchor="start">Retained cells carry their own mass; mobile water uses one mixed reactor per LID node.</text><rect x="28" y="112" width="1144" height="259" rx="14" fill="white" stroke="none" opacity="1"/><rect x="52" y="139" width="300" height="156" rx="10" fill="#eaf1f4" stroke="none" opacity="1"/><text x="68" y="169" font-size="17" fill="#008f83" font-weight="bold" text-anchor="start">RETAINED CELL</text><text x="68" y="216" font-size="28" fill="#008f83" font-weight="normal" text-anchor="start">Cᵣ = Mᵣ / Vᵣ</text><text x="68" y="259" font-size="18" fill="#557080" font-weight="normal" text-anchor="start">Cell-specific decay kᵣ</text><rect x="441" y="139" width="329" height="156" rx="10" fill="#eaf1f4" stroke="none" opacity="1"/><text x="457" y="169" font-size="17" fill="#188fb6" font-weight="bold" text-anchor="start">SHARED MOBILE REACTOR</text><text x="457" y="216" font-size="28" fill="#188fb6" font-weight="normal" text-anchor="start">C<tspan baseline-shift="sub" font-size="75%">m</tspan> = M<tspan baseline-shift="sub" font-size="75%">m</tspan> / V<tspan baseline-shift="sub" font-size="75%">m</tspan></text><text x="457" y="259" font-size="18" fill="#557080" font-weight="normal" text-anchor="start">Volume-weighted layer decay</text><rect x="860" y="139" width="287" height="156" rx="10" fill="#eaf1f4" stroke="none" opacity="1"/><text x="876" y="169" font-size="17" fill="#db8b24" font-weight="bold" text-anchor="start">PHYSICAL LAYER EXIT</text><text x="876" y="216" font-size="28" fill="#db8b24" font-weight="normal" text-anchor="start">C_exit = (1 − r) C</text><text x="876" y="259" font-size="18" fill="#557080" font-weight="normal" text-anchor="start">Optional expression follows</text><line x1="358" y1="199" x2="432" y2="199" stroke="#008f83" stroke-width="4" marker-end="url(#arrow)"/><line x1="432" y1="247" x2="358" y2="247" stroke="#188fb6" stroke-width="4" marker-end="url(#arrow)"/><line x1="777" y1="220" x2="850" y2="220" stroke="#188fb6" stroke-width="4" marker-end="url(#arrow)"/><text x="52" y="341" font-size="23" fill="#123047" font-weight="bold" text-anchor="start">Each transfer: source loses ΔV × C_source; receiver gains the treated remainder.</text><rect x="28" y="393" width="728" height="397" rx="14" fill="white" stroke="none" opacity="1"/><rect x="780" y="393" width="392" height="397" rx="14" fill="white" stroke="none" opacity="1"/><text x="52" y="431" font-size="25" fill="#123047" font-weight="bold" text-anchor="start">Closed-parcel illustration: k = 2/day</text><line x1="107" y1="715" x2="704" y2="715" stroke="#dce6eb" stroke-width="1"/><text x="93" y="721" font-size="18" fill="#557080" font-weight="normal" text-anchor="end">0.0</text><line x1="107" y1="597.5" x2="704" y2="597.5" stroke="#dce6eb" stroke-width="1"/><text x="93" y="603.5" font-size="18" fill="#557080" font-weight="normal" text-anchor="end">0.5</text><line x1="107" y1="480" x2="704" y2="480" stroke="#dce6eb" stroke-width="1"/><text x="93" y="486" font-size="18" fill="#557080" font-weight="normal" text-anchor="end">1.0</text><text x="107.0" y="743" font-size="18" fill="#557080" font-weight="normal" text-anchor="middle">0</text><text x="256.25" y="743" font-size="18" fill="#557080" font-weight="normal" text-anchor="middle">6</text><text x="405.5" y="743" font-size="18" fill="#557080" font-weight="normal" text-anchor="middle">12</text><tex