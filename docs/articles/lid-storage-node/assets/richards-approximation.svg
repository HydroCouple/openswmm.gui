<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1200" height="820" rx="0" fill="#f7fafb" stroke="none" opacity="1"/><text x="36" y="48" font-size="31" fill="#123047" font-weight="bold" text-anchor="start">Retain the water balance. Simplify the soil-pressure solve.</text><text x="36" y="84" font-size="23" fill="#557080" font-weight="normal" text-anchor="start">A conditional approximation for gravity-dominated engineered media—not every LID.</text><rect x="28" y="112" width="554" height="475" rx="14" fill="white" stroke="none" opacity="1"/><rect x="608" y="112" width="564" height="475" rx="14" fill="white" stroke="none" opacity="1"/><text x="52" y="151" font-size="25" fill="#123047" font-weight="bold" text-anchor="start">Richards-equation soil domain</text><text x="632" y="151" font-size="25" fill="#123047" font-weight="bold" text-anchor="start">Current storage-node approximation</text><rect x="150" y="189" width="299" height="243" rx="0" fill="#e2d5bd" stroke="none" opacity="1"/><rect x="737" y="189" width="299" height="243" rx="0" fill="#e2d5bd" stroke="none" opacity="1"/><line x1="170" y1="237" x2="431" y2="217" stroke="#db8b24" stroke-width="2" stroke-dasharray="6 4"/><line x1="170" y1="277" x2="431" y2="257" stroke="#db8b24" stroke-width="2" stroke-dasharray="6 4"/><line x1="170" y1="317" x2="431" y2="297" stroke="#db8b24" stroke-width="2" stroke-dasharray="6 4"/><line x1="170" y1="357" x2="431" y2="337" stroke="#db8b24" stroke-width="2" stroke-dasharray="6 4"/><line x1="170" y1="397" x2="431" y2="377" stroke="#db8b24" stroke-width="2" stroke-dasharray="6 4"/><line x1="210" y1="217" x2="210" y2="250" stroke="#008f83" stroke-width="4" marker-end="url(#arrow)"/><line x1="371" y1="314" x2="371" y2="347" stroke="#008f83" stroke-width="4" marker-end="url(#arrow)"/><line x1="250" y1="383" x2="250" y2="416" stroke="#008f83" stroke-width="4" marker-end="url(#arrow)"/><line x1="244" y1="301" x2="309" y2="277" stroke="#db8b24" stroke-width="4" marker-end="url(#arrow)"/><line x1="366" y1="367" x2="342" y2="323" stroke="#db8b24" stroke-width="4" marker-end="url(#arrow)"/><text x="52" y="471" font-size="22" fill="#557080" font-weight="normal" text-anchor="start">Gravity plus matric-pressure gradients</text><text x="52" y="508" font-size="26" fill="#123047" font-weight="normal" text-anchor="start">∂θ/∂t = ∇·[K(θ) ∇(ψ + z)] − S</text><text x="52" y="549" font-size="20" fill="#557080" font-weight="normal" text-anchor="start">Requires retention and conductivity relations.</text><line x1="737" y1="228" x2="1036" y2="228" stroke="#557080" stroke-width="1" stroke-dasharray="5 4"/><line x1="737" y1="267" x2="1036" y2="267" stroke="#557080" stroke-width="1" stroke-dasharray="5 4"/><line x1="737" y1="306" x2="1036" y2="306" stroke="#557080" stroke-width="1" stroke-dasharray="5 4"/><line x1="737" y1="345" x2="1036" y2="345" stroke="#557080" stroke-width="1" stroke-dasharray="5 4"/><line x1="887" y1="204" x2="887" y2="234" stroke="#008f83" stroke-width="4" marker-end="url(#arrow)"/><line x1="887" y1="247" x2="887" y2="277" stroke="#008f83" stroke-width="4" marker-end="url(#arrow)"/><line x1="887" y1="290" x2="887" y2="320" stroke="#008f83" stroke-width="4" marker-end="url(#arrow)"/><rect x="737" y="352" width="299" height="80" rx="0" fill="#188fb6" stroke="none" opacity="0.6"/><line x1="718" y1="352" x2="1138" y2="352" stroke="#188fb6" stroke-width="2" stroke-dasharray="6 4"/><text x="1046" y="340" font-size="23" fill="#188fb6" font-weight="bold" text-anchor="start">h</text><line x1="1036" y1="406" x2="1134" y2="406" stroke="#188fb6" stroke-width="4" marker-end="url(#arrow)"/><text x="1046" y="441" font-size="18" fill="#188fb6" font-weight="normal" text-anchor="start">Network</text><text x="632" y="471" font-size="22" fill="#557080" font-weight="normal" text-anchor="start">Downward K(θ) flux; shared mobile head</text><text x="632" y="508" font-size="25" fill="#123047" font-weight="normal" text-anchor="start">Gᵢ dθᵢ/dt = Q_in,ᵢ − Q_out,ᵢ − Eᵢ</text><text x="632" y="549" font-size="20" fill="#557080" font-weight="normal" text-anchor="start">Green–Ampt entry; field-capacity drainage cutoff.</text><rect x="28" y="611" width="554" height="179" rx="12" fill="#eaf1f4" stroke="none" opacity="1"/><rect x="608" y="611" width="564" height="179" rx="12" fill="#eaf1f4" stroke="none" opacity="1"/><text x="52" y="650" font-size="25" fill="#008f83" font-weight="bold" text-anchor="start">Useful when</text><text x="52" y="691" font-size="22" fill="#557080" font-weight="normal" text-anchor="start">Vertical gravity drainage dominates in coarse,</text><text x="52" y="722" font-size="22" fill="#557080" font-weight="normal" text-anchor="start">relatively uniform media, and the objective is</text><text x="52" y="753" font-size="22" fill="#557080" font-weight="normal" text-anchor="start">network detention, discharge and control.</text><text x="632" y="650" font-size="25" fill="#db8b24" font-weight="bold" text-anchor="start">A richer model may be needed when</text><text x="632" y="691" font-size="22" fill="#557080" font-weight="normal" text-anchor="start">Capillary barriers or upward supply matter,</text><text x="632" y="722" font-size="22" fill="#557080" font-weight="normal" text-anchor="start">or detailed moisture, root uptake and preferential</text><text x="632" y="753" font-size="22" fill="#557080" font-weight="normal" text-anchor="start">pathways determine performance. Check field data.</text></svg>