<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1200" height="820" rx="0" fill="#f7fafb" stroke="none" opacity="1"/><text x="36" y="48" font-size="30" fill="#123047" font-weight="bold" text-anchor="start">Two selectable models: label the formulation being tested</text><text x="36" y="84" font-size="22" fill="#557080" font-weight="normal" text-anchor="start">Both conserve water. Their moisture dynamics, parameters and hydraulic state differ.</text><rect x="28" y="112" width="558" height="498" rx="14" fill="white" stroke="none" opacity="1"/><text x="52" y="156" font-size="23" fill="#557080" font-weight="bold" text-anchor="start">EXISTING FORMULATION</text><text x="52" y="214" font-size="21" fill="#123047" font-weight="normal" text-anchor="start">Gravity drainage K<tspan baseline-shift="sub" font-size="75%">s</tspan> exp[−slope(φ − θ)]</text><text x="52" y="279" font-size="21" fill="#123047" font-weight="normal" text-anchor="start">Field-capacity cutoff in media</text><text x="52" y="344" font-size="21" fill="#123047" font-weight="normal" text-anchor="start">Modified Green–Ampt surface entry</text><text x="52" y="409" font-size="21" fill="#123047" font-weight="normal" text-anchor="start">Retained cells + shared mobile reservoir</text><text x="52" y="474" font-size="21" fill="#123047" font-weight="normal" text-anchor="start">Backwater reconciles front history</text><text x="52" y="539" font-size="21" fill="#123047" font-weight="normal" text-anchor="start">No intercell matric-pressure gradient</text><rect x="614" y="112" width="558" height="498" rx="14" fill="white" stroke="none" opacity="1"/><text x="638" y="156" font-size="23" fill="#008f83" font-weight="bold" text-anchor="start">SEMI-DISCRETE RICHARDS 1D</text><text x="638" y="214" font-size="21" fill="#123047" font-weight="normal" text-anchor="start">Signed flux from gradients of H = z + ψ</text><text x="638" y="279" font-size="21" fill="#123047" font-weight="normal" text-anchor="start">van Genuchten–Mualem retention / K</text><text x="638" y="344" font-size="21" fill="#123047" font-weight="normal" text-anchor="start">Pond contact integrated with the column</text><text x="638" y="409" font-size="21" fill="#123047" font-weight="normal" text-anchor="start">Cell-owned pore and elastic storage</text><text x="638" y="474" font-size="21" fill="#123047" font-weight="normal" text-anchor="start">Local pressure responds to reverse inflow</text><text x="638" y="539" font-size="21" fill="#123047" font-weight="normal" text-anchor="start">Adaptive implicit integration</text><rect x="28" y="632" width="1144" height="146" rx="12" fill="#eaf1f4" stroke="none" opacity="1"/><text x="53" y="673" font-size="23" fill="#123047" font-weight="bold" text-anchor="start">Still 1D matrix flow: no lateral unsaturated gradients, preferential flow or hysteresis.</text><text x="53" y="715" font-size="22" fill="#557080" font-weight="normal" text-anchor="start">Richards requires explicit retention / specific-storage inputs and cell/time refinement.</text><text x="53" y="752" font-size="23" fill="#008f83" font-weight="bold" text-anchor="start">A passing gravity-model example cannot establish Richards accuracy.</text></svg>