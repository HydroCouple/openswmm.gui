name: Documentation

on:
  push:
    branches: ["main", "master", "dev", "swmm6_gui"]
  pull_request:
    branches:
      - main
      - dev

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; cancel in-progress runs but do not
# cancel the in-progress deployment itself.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the crosswalk audit below resolves the retired
          # legacy manuals with `git show <crosswalk-source-ref>:<path>`, and
          # the default shallow clone (depth 1) has no such commit — the
          # check then reports the files as missing AT the ref, which reads
          # like a stale pin rather than a truncated clone.
          fetch-depth: 0

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install Doxygen 1.17.0
        # Pinned to the same release as the other HydroCouple manuals (the
        # shared docs theme is written for it), not the runner's apt package.
        run: |
          DOXYGEN_VERSION=1.17.0
          DOXYGEN_SHA256=75419ef4f446fc1c24ef12514b574e66e898ee6f527c6ae2ad84f91a905823c2
          # Doxygen release TAGS use underscores (Release_1_17_0) while the
          # asset filename uses dots (doxygen-1.17.0.linux.bin.tar.gz).
          DOXYGEN_TAG="Release_${DOXYGEN_VERSION//./_}"
          wget -q "https://github.com/doxygen/doxygen/releases/download/${DOXYGEN_TAG}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          echo "${DOXYGEN_SHA256}  doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz" | sha256sum --check
          tar -xzf doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz
          sudo mv doxygen-${DOXYGEN_VERSION}/bin/doxygen /usr/local/bin/doxygen
          doxygen --version

      - name: Audit the manual
        # All three read only in-repo sources, so this job never needs the
        # engine checkout. The error-catalog check, which does, runs in
        # build_and_test.yml where the engine is already cloned.
        run: |
          python3 scripts/manual_docs_audit.py crosswalk --strict
          python3 scripts/manual_docs_audit.py property-labels
          python3 scripts/manual_docs_audit.py culvert-codes
          python3 scripts/manual_figures.py audit
          python3 scripts/manual_docs_audit.py links

      - name: Generate API documentation
        # Doxyfile paths are relative to the config's own dir (OUTPUT_DIRECTORY=.,
        # INPUT=../README.md ../include ..., HTML_OUTPUT=html), so doxygen must run
        # from docs/ — else INPUT resolves above the repo and HTML lands in ./html
        # instead of docs/html, leaving the Pages upload (path: docs/html) empty.
        working-directory: docs
        # docs/CNAME pins the Pages custom domain and must sit at the root of
        # the published site, which is docs/html.
        run: |
          doxygen Doxyfile
          test -n "$(find html -name gui_extension_sdk.html -print -quit)"
          test -n "$(find html -name _extension_host_8hpp.html -print -quit)"
          test -n "$(find html -name extensionmodelaccess_8h.html -print -quit)"
          cp CNAME html/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

  deploy-docs:
    needs: build-docs
    # build-docs also runs on pull_request so PRs get a build check; without this
    # guard a PR would publish to the live Pages site.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
