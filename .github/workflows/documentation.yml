name: Documentation

on:
  push:
    branches: ["main", "master", "dev", "swmm6_gui"]
  pull_request:
    branches:
      - main
      - dev

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; cancel in-progress runs but do not
# cancel the in-progress deployment itself.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Audit the manual
        # All three read only in-repo sources, so this job never needs the
        # engine checkout. The error-catalogue check, which does, runs in
        # build_and_test.yml where the engine is already cloned.
        run: |
          python3 scripts/manual_docs_audit.py crosswalk --strict
          python3 scripts/manual_docs_audit.py property-labels
          python3 scripts/manual_docs_audit.py culvert-codes
          python3 scripts/manual_figures.py audit

      - name: Generate API documentation
        # Doxyfile paths are relative to the config's own dir (OUTPUT_DIRECTORY=.,
        # INPUT=../README.md ../include ..., HTML_OUTPUT=html), so doxygen must run
        # from docs/ — else INPUT resolves above the repo and HTML lands in ./html
        # instead of docs/html, leaving the Pages upload (path: docs/html) empty.
        working-directory: docs
        # docs/CNAME pins the Pages custom domain and must sit at the root of
        # the published site, which is docs/html.
        run: |
          doxygen Doxyfile
          cp CNAME html/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

  deploy-docs:
    needs: build-docs
    # build-docs also runs on pull_request so PRs get a build check; without this
    # guard a PR would publish to the live Pages site.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
