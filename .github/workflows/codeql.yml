name: CodeQL

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  schedule:
    # Weekly scan so newly disclosed CWE queries hit dormant branches too.
    # Mondays at 06:00 UTC — outside US-business hours but before EU-morning.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # build-mode: none skips compilation entirely. The Qt + vcpkg toolchain
          # needed to compile this repo would dominate run time (~30 min cold
          # cache); the no-build analyzer covers the same source files in ~3-5
          # min at the cost of macro-expansion / template-instantiation depth.
          - language: c-cpp
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
