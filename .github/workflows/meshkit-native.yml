name: MeshKit native package
on:
  pull_request:
    paths: ['libraries/meshkit/**', '.github/workflows/meshkit-native.yml']
  push:
    paths: ['libraries/meshkit/**', '.github/workflows/meshkit-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test and package tools
        run: python -m pip install numpy setuptools wheel
      - name: Configure without Qt
        run: cmake -S libraries/meshkit -B out/meshkit -DMESHKIT_BUILD_QT=OFF -DMESHKIT_BUILD_PYTHON=ON -DMESHKIT_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build out/meshkit --config Release --parallel 4
      - name: Test
        run: ctest --test-dir out/meshkit -C Release --output-on-failure
      - name: Build source and wheel packages
        working-directory: libraries/meshkit
        run: python setup.py build --build-base ../../out/package bdist_wheel --dist-dir ../../out/dist sdist --dist-dir ../../out/dist
