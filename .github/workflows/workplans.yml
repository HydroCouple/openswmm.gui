name: Keep workplans local

on:
  push:
    branches: [swmm6_gui]
  pull_request:
    branches: [swmm6_gui, main, master, dev]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check incoming commits for workplans
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          history=HEAD
          if [[ -n "$BASE" && "$BASE" != 0000000000000000000000000000000000000000 ]] &&
             git rev-parse --verify --quiet "$BASE^{commit}" > /dev/null; then
            history="$BASE..HEAD"
          fi
          paths=(
            ':(glob,icase)**/plans/**'
            ':(glob,icase)**/workplans/**'
            ':(glob,icase)**/workpans/**'
            ':(glob,icase)**/work[-_ ]plans/**'
            ':(glob,icase)**/*workplan*.md'
            ':(glob,icase)docs/development/*-plan.md'
          )
          matches=$(git log --root --full-history -m --no-renames --diff-filter=AMT \
            --format= --name-only "$history" -- "${paths[@]}")
          if [[ -n "$matches" ]]; then
            echo "Workplans must stay local. Remove these paths from the incoming commits."
            printf '%s\n' "$matches" | sort -u
            exit 1
          fi
