name: Build and Package

on:
  push:
    branches: ["main", "dev", "swmm6_gui"]
  pull_request:
    branches: ["main", "dev", "swmm6_gui"]

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  OMP_NUM_THREADS: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmake_preset: Windows
            build_subdir: windows
            vcpkg_triplet: x64-windows
            shell_ext: .bat
            # For Qt 6.7.x on aqt, addon modules are reliably available on the MSVC2019 kit.
            qt_arch: win64_msvc2019_64

          - os: ubuntu-latest
            cmake_preset: Linux
            build_subdir: linux
            vcpkg_triplet: x64-linux
            shell_ext: .sh
            qt_arch: linux_gcc_64

          - os: macos-13
            cmake_preset: Darwin
            build_subdir: darwin
            vcpkg_triplet: x64-osx
            shell_ext: .sh
            qt_arch: clang_64

          - os: macos-latest
            cmake_preset: Darwin
            build_subdir: darwin
            vcpkg_triplet: arm64-osx
            shell_ext: .sh
            qt_arch: clang_64

    runs-on: ${{ matrix.os }}

    steps:
      # ── Source repos ────────────────────────────────────────────────────────
      - name: Checkout openswmm.gui
        uses: actions/checkout@v4

      - name: Checkout vcpkg
        uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: 2025.02.14
          path: vcpkg

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.VCPKG_ROOT }}
        run: |
          .\bootstrap-vcpkg${{ matrix.shell_ext }}
          .\vcpkg.exe integrate install

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        working-directory: ${{ env.VCPKG_ROOT }}
        run: |
          ./bootstrap-vcpkg${{ matrix.shell_ext }}
          chmod +x vcpkg

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

#      # openswmm.engine must sit at ../openswmm.engine relative to openswmm.gui so that
#      # `FetchOpenSWMMEngine.cmake` can pick up the sibling checkout automatically.
#      - name: Checkout Open SWMM Engine (swmm6_rel)
#        uses: actions/checkout@v4
#        with:
#          repository: HydroCouple/openswmm.engine
#          ref: swmm6_rel
#          path: ../openswmm.engine
#
#      # QPropertyModel must sit at ../QPropertyModel for the FetchContent SOURCE_DIR path.
#      - name: Checkout QPropertyModel (dev)
#        uses: actions/checkout@v4
#        with:
#          repository: cbuahin/QPropertyModel
#          ref: dev
#          path: ../QPropertyModel

      # ── System dependencies ──────────────────────────────────────────────────
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ninja-build

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

#      # Qt is not in vcpkg.json — install via aqtinstall.
#      # Modules: qtcharts + qtsvg are required by CMakeLists.txt (Qt::Charts, Qt::Svg).
#      - name: Install Qt 6
#        uses: jurplel/install-qt-action@v4
#        with:
#          version: '6.7.*'
#          arch: ${{ matrix.qt_arch }}
#          modules: 'qtcharts qtsvg'
#          cache: true

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Configure
        run: cmake --preset=${{ matrix.cmake_preset }} -DSWMMVIS_BUILD_TESTS=ON

      - name: Build and Package
        run: cmake --build --preset=${{ matrix.cmake_preset }}

      # ── Test ─────────────────────────────────────────────────────────────────
      - name: Test
        run: ctest --test-dir build/${{ matrix.build_subdir }} -C Release --output-on-failure

      # ── Artifacts ────────────────────────────────────────────────────────────
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swmmvis-${{ matrix.vcpkg_triplet }}
          path: |
            build/${{ matrix.build_subdir }}/*.zip
            build/${{ matrix.build_subdir }}/*.tar.gz
            build/${{ matrix.build_subdir }}/*.exe
            build/${{ matrix.build_subdir }}/*.dmg

