name: Build and Package

on:
  push:
    branches: ["main", "dev", "swmm6_gui"]
  pull_request:
    branches: ["main", "dev", "swmm6_gui"]

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmake_preset: Windows
            build_subdir: windows
            vcpkg_triplet: x64-windows
            shell_ext: .bat
            qt_arch: win64_msvc2022_64

          - os: ubuntu-latest
            cmake_preset: Linux
            build_subdir: linux
            vcpkg_triplet: x64-linux
            shell_ext: .sh
            qt_arch: linux_gcc_64

          - os: macos-13
            cmake_preset: Darwin
            build_subdir: darwin
            vcpkg_triplet: x64-osx
            shell_ext: .sh
            qt_arch: clang_64

          - os: macos-latest
            cmake_preset: Darwin
            build_subdir: darwin
            vcpkg_triplet: arm64-osx
            shell_ext: .sh
            qt_arch: clang_64

    runs-on: ${{ matrix.os }}

    steps:
      # ── Source repos ────────────────────────────────────────────────────────
      - name: Checkout openswmm.gui
        uses: actions/checkout@v4

      # OpenSWMMCore must sit at ../OpenSWMMCore relative to openswmm.gui so that
      # CMakeLists.txt's  add_subdirectory("${CMAKE_SOURCE_DIR}/../OpenSWMMCore")  resolves.
      - name: Checkout OpenSWMMCore (swmm6_rel)
        uses: actions/checkout@v4
        with:
          repository: HydroCouple/openswmm.gui
          ref: swmm6_gui
          path: ../openswmm.gui

      # QPropertyModel must sit at ../QPropertyModel for the FetchContent SOURCE_DIR path.
      - name: Checkout QPropertyModel (dev)
        uses: actions/checkout@v4
        with:
          repository: cbuahin/QPropertyModel
          ref: dev
          path: ../openswmm.gui

      # ── vcpkg ────────────────────────────────────────────────────────────────
      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: '2025.03.19'
          path: ../vcpkg

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}/../vcpkg
        shell: cmd
        run: |
          bootstrap-vcpkg${{ matrix.shell_ext }}
          vcpkg.exe integrate install

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        working-directory: ${{ github.workspace }}/../vcpkg
        run: |
          ./bootstrap-vcpkg${{ matrix.shell_ext }}
          chmod +x vcpkg

      # Resolve VCPKG_ROOT to an absolute path so the CMake toolchain file finds it
      # on all platforms, avoiding any ambiguity from the "../vcpkg" relative prefix.
      - name: Set VCPKG_ROOT (Unix)
        if: runner.os != 'Windows'
        run: echo "VCPKG_ROOT=$(cd '${{ github.workspace }}/../vcpkg' && pwd)" >> $GITHUB_ENV

      - name: Set VCPKG_ROOT (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          pushd "%GITHUB_WORKSPACE%\..\vcpkg"
          echo VCPKG_ROOT=%CD%>> %GITHUB_ENV%
          popd

      # ── System dependencies ──────────────────────────────────────────────────
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ninja-build

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Qt is not in vcpkg.json — install via aqtinstall.
      # Modules: qtcharts + qtsvg are required by CMakeLists.txt (Qt::Charts, Qt::Svg).
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          arch: ${{ matrix.qt_arch }}
          modules: 'qtcharts qtsvg'
          cache: true

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Configure
        run: cmake --preset=${{ matrix.cmake_preset }} -DSWMMVIS_BUILD_TESTS=ON

      - name: Build and Package
        run: cmake --build --preset=${{ matrix.cmake_preset }}

      # ── Test ─────────────────────────────────────────────────────────────────
      - name: Test
        run: ctest --test-dir build/${{ matrix.build_subdir }} -C Release --output-on-failure

      # ── Artifacts ────────────────────────────────────────────────────────────
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swmmvis-${{ matrix.vcpkg_triplet }}
          path: |
            build/${{ matrix.build_subdir }}/*.zip
            build/${{ matrix.build_subdir }}/*.tar.gz
            build/${{ matrix.build_subdir }}/*.exe
            build/${{ matrix.build_subdir }}/*.dmg