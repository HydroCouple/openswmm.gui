name: Build and Package

on:
  push:
    branches: ["main", "dev", "swmm6_gui"]
  pull_request:
    branches: ["main", "dev", "swmm6_gui"]

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  OMP_NUM_THREADS: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmake_preset: Windows
            build_subdir: windows
            vcpkg_triplet: x64-windows
            shell_ext: .bat
            # For Qt 6.7.x on aqt, addon modules are reliably available on the MSVC2019 kit.
            qt_arch: win64_msvc2019_64

          - os: ubuntu-latest
            cmake_preset: Linux
            build_subdir: linux
            vcpkg_triplet: x64-linux
            shell_ext: .sh
            qt_arch: linux_gcc_64

          - os: macos-latest
            cmake_preset: Darwin
            build_subdir: darwin
            vcpkg_triplet: arm64-osx
            shell_ext: .sh
            qt_arch: clang_64

    runs-on: ${{ matrix.os }}

    steps:
      # ── Source repos ────────────────────────────────────────────────────────
      - name: Checkout openswmm.gui
        uses: actions/checkout@v4

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 2025.02.14
          fetch-depth: 0
          path: vcpkg

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.VCPKG_ROOT }}
        run: |
          .\bootstrap-vcpkg${{ matrix.shell_ext }}
          .\vcpkg.exe integrate install

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        working-directory: ${{ env.VCPKG_ROOT }}
        run: |
          ./bootstrap-vcpkg${{ matrix.shell_ext }}
          chmod +x vcpkg

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache vcpkg downloads (source tarballs)
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-downloads-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-
            vcpkg-downloads-${{ runner.os }}-

      # openswmm.engine and QPropertyModel are fetched automatically via
      # FetchOpenSWMMEngine.cmake / FetchQPropertyModel.cmake at configure time.
      # No explicit checkout steps needed.

      # ── System dependencies ──────────────────────────────────────────────────
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Qt is not in vcpkg.json — install via aqtinstall.
      # qtsvg is bundled in the Qt 6 base installation and is NOT an installable
      # add-on module on Linux (aqt will error if listed). Only qtcharts needs to
      # be requested explicitly.
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          arch: ${{ matrix.qt_arch }}
          modules: 'qtcharts'
          cache: true

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Configure
        run: cmake --preset=${{ matrix.cmake_preset }} -DSWMMVIS_BUILD_TESTS=ON

      - name: Build and Package
        run: cmake --build --preset=${{ matrix.cmake_preset }}

      # ── Test ─────────────────────────────────────────────────────────────────
      - name: Test
        run: ctest --test-dir build/${{ matrix.build_subdir }} -C Release --output-on-failure

      # ── Install (staging tree) ────────────────────────────────────────────
      # cmake --install copies the built binary + all install() rules into
      # dist/<subdir>/ — windeployqt / macdeployqt install(CODE) runs here too.
      - name: Install
        run: cmake --install build/${{ matrix.build_subdir }} --prefix ${{ github.workspace }}/dist/${{ matrix.build_subdir }}

      # ── Package (CPack) ───────────────────────────────────────────────────
      # CPack reads the install tree and produces a platform-appropriate archive
      # (.dmg on macOS, .zip on Windows, .tar.gz on Linux).
      - name: Package
        run: cpack --config build/${{ matrix.build_subdir }}/CPackConfig.cmake -B ${{ github.workspace }}/packages

      # ── Artifacts ────────────────────────────────────────────────────────
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swmmvis-${{ matrix.vcpkg_triplet }}
          path: packages/

