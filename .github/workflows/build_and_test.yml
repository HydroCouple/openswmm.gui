name: build and package

on:
  push:
    branches: [ "main", "dev"]
  pull_request:
    branches: [ "main", "dev"]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_EXE:  ${{ github.workspace }}/vcpkg/vcpkg
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  OMP_NUM_THREADS: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-13, macos-latest]
        include:
          - os: windows-latest
            alias: win64
            cmake_preset: Windows
            shell: cmd
            shell_extension: .bat
            vcpkg_triplet: x64-windows        

          - os: ubuntu-latest
            alias: Linux
            shell: bash
            cmake_preset: Linux
            shell_extension: .sh
            vcpkg_triplet: x64-linux

          - os: macos-13
            alias: intel-mac
            cmake_preset: Darwin
            shell: bash
            shell_extension: .sh
            vcpkg_triplet: x64-osx

          - os: macos-latest
            alias: apple-silicon
            cmake_preset: Darwin
            shell: bash
            shell_extension: .sh
            vcpkg_triplet: arm64-osx

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout SWMM Vis
        uses: actions/checkout@v3

      - name: Checkout VCPKG
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 2025.03.19
          path: vcpkg
      
      # - name: Set up Python
      #   uses: actions/setup-python@v4
      #   with:
      #     python-version: '3.8'

      - name: Bootstrap VCPKG (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        working-directory: ${{ env.VCPKG_ROOT }}
        run: |
          .\bootstrap-vcpkg${{ matrix.shell_extension }}
          .\vcpkg.exe integrate install
      
      - name: Bootstrap VCPKG (Unix like)
        if: ${{ matrix.os != 'windows-latest' }}
        working-directory: ${{ env.VCPKG_ROOT }}
        run: |
          ./bootstrap-vcpkg${{ matrix.shell_extension }}
          chmod +x vcpkg
  
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
 
      - name: Build Binaries
        run: |
          cmake --preset=${{ matrix.cmake_preset }}-debug -B build-${{ matrix.vcpkg_triplet }}
          cmake --build build-${{ matrix.vcpkg_triplet }} --target package 

      - name: Build
        # Build your program with the given configuration
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: ${{github.workspace}}/build
        # Execute tests defined by the CMake configuration.
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        run: ctest -C ${{env.BUILD_TYPE}} 

      - name: Upload Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.vcpkg_triplet }}
          path: |
            build-${{ matrix.vcpkg_triplet }}/*.tar.gz
            build-${{ matrix.vcpkg_triplet }}/*.zip