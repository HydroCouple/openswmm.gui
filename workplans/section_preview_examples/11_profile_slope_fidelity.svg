<text x="14.0" y="524.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#6b7a88" text-anchor="start" font-weight="normal">True gradient 0.25 %. Filling both axes ties the exaggeration to the pane, so the same pipe reads steeper in a taller dock.</text>
<text x="14.0" y="540.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#6b7a88" text-anchor="start" font-weight="normal">The new fit derives the ratio from the model's own proportions (a 6:1 drawn aspect), caps at 10:1, and states the ratio on the drawing. 1:1 is selectable for the true picture.</text>
